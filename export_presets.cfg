; COIL — export presets. Roadmap M0-03, D-07, D-17.
;
; Hand-authored so the diff is readable; the editor rewrites this file whenever
; the export dialog is opened, so check the diff before committing.
;
; Two rules this file must keep:
;   1. arm64-v8a ONLY. D-17 accepts ~20 MB of .NET runtime in the APK on the
;      condition that exactly one ABI ships. Turning on a second doubles it.
;   2. NO keystore credentials here. This file is committed. The debug keystore
;      comes from editor settings (export/android/debug_keystore); the release
;      one arrives with M5-11.
;   3. gradle_build/use_gradle_build MUST stay true. The prebuilt template
;      hardcodes a required TFM of net9.0 and rejects anything else, because it
;      bundles .jar dependencies from that .NET version
;      (platform/android/export/export_plugin.cpp, godotengine/godot#102627).
;      A gradle build takes those .jars from our own build output instead
;      (godotengine/godot#98066), which is what lets ARCH §2's net8.0 stand.

